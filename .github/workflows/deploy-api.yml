name: Deploy API (Hostinger)

# ATENCIÓN: antes del primer despliegue real, sincronizar este repositorio con lo que está en
# producción. El API en vivo ya tiene funciones que este código no (p. ej. el descuento por
# categoría y final_price); copiar el repo encima las pisaría. Empezar siempre con dry_run.
#
# Despliegue MANUAL del backend Laravel. Solo se ejecuta cuando alguien pulsa
# "Run workflow" en la pestaña Actions; nunca por un push.
#
# Antes del primer uso hay que crear estos secretos en GitHub (Settings > Secrets):
#   HOSTINGER_SSH_HOST         IP o host del servidor (hPanel > Avanzado > Acceso SSH)
#   HOSTINGER_SSH_PORT         puerto SSH (en Hostinger compartido suele ser 65002; confirmarlo)
#   HOSTINGER_SSH_USER         u206357267
#   HOSTINGER_SSH_KEY          llave privada SSH dedicada solo a esto
#   HOSTINGER_SSH_KNOWN_HOSTS  salida de: ssh-keyscan -p <puerto> <host>
#
# Por defecto hace una simulación (dry_run = true): lista lo que cambiaría y no copia nada.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo simular (no copia nada)'
        type: boolean
        default: true
      run_migrations:
        description: 'Ejecutar php artisan migrate --force después de copiar'
        type: boolean
        default: false

env:
  # Raíz de la app en el servidor (la carpeta pública del sitio es <raíz>/public).
  REMOTE_PATH: /home/u206357267/domains/fathermotosport.com/public_html/api

jobs:
  tests:
    name: Pruebas antes de desplegar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fathermotosport-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip, bcmath, exif
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  deploy:
    name: Copiar al servidor
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: fathermotosport-api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip, bcmath, exif
          coverage: none

      # Las dependencias de producción se instalan aquí y se copian: no se asume que el
      # servidor tenga Composer.
      - run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.HOSTINGER_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Nunca se copian ni se borran: .env (secretos del servidor), storage (archivos
      # subidos y logs) ni public/storage (enlace simbólico a storage).
      - name: Copiar archivos
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          # Sin --delete a propósito: el servidor puede tener archivos que no están en el
          # repositorio (subidas en public/, por ejemplo) y borrarlos sería irreversible.
          rsync -az $DRY --itemize-changes \
            --exclude='.env' --exclude='.git' --exclude='tests' --exclude='node_modules' \
            --exclude='storage' --exclude='public/storage' --exclude='bootstrap/cache/*.php' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            ./ "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:${REMOTE_PATH}/"

      - name: Migraciones y cachés
        if: ${{ inputs.dry_run == false }}
        run: |
          MIGRATE=""
          if [ "${{ inputs.run_migrations }}" = "true" ]; then MIGRATE="php artisan migrate --force &&"; fi
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.HOSTINGER_SSH_PORT }} \
            "${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}" \
            "cd ${REMOTE_PATH} && ${MIGRATE} php artisan config:cache && php artisan route:cache && php artisan view:cache"
