name: CI

# Corre las pruebas del backend y revisa los tipos del frontend en cada push y pull request.
# No despliega nada: el despliegue es un flujo aparte y manual (deploy-api.yml).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Backend (Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fathermotosport-api
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, gd, zip, bcmath, exif
          coverage: none

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('fathermotosport-api/composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Preparar entorno de pruebas
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml ya usa SQLite en memoria; no toca ninguna base real.
      - run: php artisan test

  web:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fathermotosport-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm ci` falla hoy porque package-lock.json está desincronizado con package.json
      # (falta @swc/helpers). Cuando se regenere el lock, cambiar esta línea por `npm ci`.
      - run: npm install --no-audit --no-fund

      - name: Revisar tipos
        run: npx tsc --noEmit
